name: Windows release
on:
  push:
    tags: ['v*']
    branches: [main]
    paths: ['.github/workflows/release.yml', 'PortwatchDesktop.csproj']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build standalone executable
        run: dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts
      - name: Verify executable
        shell: pwsh
        run: |
          foreach ($arg in @('--self-test','--smoke-gui')) {
            $test = Start-Process -FilePath ./artifacts/PortwatchDesktop.exe -ArgumentList $arg -Wait -PassThru -WindowStyle Hidden
            if ($test.ExitCode -ne 0) { throw "$arg failed with exit code $($test.ExitCode)" }
          }
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: PortwatchDesktop-win-x64
          path: artifacts/PortwatchDesktop.exe
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [xml]$project = Get-Content PortwatchDesktop.csproj
          $tag = if ($env:GITHUB_REF -like 'refs/tags/*') { $env:GITHUB_REF_NAME } else { "v$($project.Project.PropertyGroup.Version)" }
          gh release view $tag > $null 2>&1
          if ($LASTEXITCODE -eq 0) { exit 0 }
          gh release create $tag artifacts/PortwatchDesktop.exe --target $env:GITHUB_SHA --title "Portwatch Desktop $tag" --generate-notes
