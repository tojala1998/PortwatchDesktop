name: Windows release
on:
  push:
    tags: ['v*']
    branches: [main]
    paths: ['.github/workflows/release.yml', 'PortwatchDesktop.csproj']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build standalone executable
        run: dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts
      - name: Verify executable
        shell: pwsh
        run: |
          foreach ($arg in @('--self-test','--smoke-gui','--smoke-tray','--smoke-settings')) {
            $test = Start-Process -FilePath ./artifacts/PortwatchDesktop.exe -ArgumentList $arg -Wait -PassThru -WindowStyle Hidden
            if ($test.ExitCode -ne 0) { throw "$arg failed with exit code $($test.ExitCode)" }
          }
      - name: Build per-user installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path -LiteralPath $iscc)) { choco install innosetup --yes --no-progress; if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' } }
          [xml]$project = Get-Content PortwatchDesktop.csproj
          & $iscc "/DAppVersion=$($project.Project.PropertyGroup.Version)" installer/PortwatchDesktop.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
          Copy-Item artifacts/PortwatchDesktop.exe artifacts/PortwatchDesktop-Portable.exe
      - name: Upload executables
        uses: actions/upload-artifact@v4
        with:
          name: PortwatchDesktop-win-x64
          path: |
            artifacts/PortwatchDesktop-Portable.exe
            artifacts/PortwatchDesktop-Setup.exe
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [xml]$project = Get-Content PortwatchDesktop.csproj
          $tag = if ($env:GITHUB_REF -like 'refs/tags/*') { $env:GITHUB_REF_NAME } else { "v$($project.Project.PropertyGroup.Version)" }
          gh release view $tag > $null 2>&1
          if ($LASTEXITCODE -eq 0) { exit 0 }
          gh release create $tag artifacts/PortwatchDesktop-Portable.exe artifacts/PortwatchDesktop-Setup.exe --target $env:GITHUB_SHA --title "Portwatch Desktop $tag" --generate-notes
